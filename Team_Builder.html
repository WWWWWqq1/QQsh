<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>QQ水浒阵容规划器 v1.2.132</title>
<style>
:root{--bg:#151923;--panel:#202633;--panel2:#282f3e;--text:#f4f5f7;--muted:#aeb7c6;--accent:#d6a84f;--line:#454e60;--active:#bfc1c4;--activeText:#17191d;--empty:#303847;--danger:#d86b67}
*{box-sizing:border-box;max-width:100%}
html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}
body{margin:0;background:linear-gradient(145deg,#151923,#1b2230 60%,#141820);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100vh}
.app{width:100%;max-width:1200px;margin:0 auto;padding:clamp(14px,3vw,28px);min-width:0;overflow-x:clip}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
h1{font-size:clamp(22px,4vw,32px);margin:0 0 7px;letter-spacing:.04em}
.subtitle{font-size:13px;color:var(--muted);line-height:1.6}
.pill{border:1px solid #77613b;color:#f0cc7e;border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap}
.panel{background:rgba(32,38,51,.94);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.5vw,22px);box-shadow:0 12px 32px #0002;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700;margin:0 0 14px}
.formation-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.formation-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px 8px;text-align:center;font-size:15px;cursor:pointer;min-height:54px}
.formation-btn small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.formation-btn.selected{border-color:var(--accent);background:#59462a;color:#ffe0a0;box-shadow:inset 0 0 0 1px #d6a84f66}
.layout{width:100%;max-width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);gap:16px;align-items:start}
.board-wrap{max-width:540px;margin:0 auto}
.board-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.board-title strong{font-size:20px}
.counter{font-size:12px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;aspect-ratio:1}
.cell{border:2px solid #606a7a;border-radius:10px;background:var(--empty);color:#6f7888;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;padding:6px;text-align:center}
.cell.active{background:var(--active);border-color:#11151c;color:var(--activeText);cursor:pointer;box-shadow:0 3px 0 #0003}
.cell.active:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cell .pos{font-size:13px;opacity:.8;margin-bottom:7px}
.cell .hero{font-size:clamp(12px,2vw,18px);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.cell .hint{font-size:11px;margin-top:6px;opacity:.72}
.cell.filled{background:#f0d7a2;border-color:#a87929;color:#352714}
.cell.filled .pos{color:#6b512c}
.cell.filled .hint{color:#725326}
/* 主阵下阵叉号：圆圈固定尺寸，叉号在圆内水平、垂直居中 */
.cell{position:relative}
.cell .main-remove-hero{position:absolute;top:4px;right:4px;z-index:6;width:22px;height:22px;min-width:22px;min-height:22px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;margin:0;padding:0 0 1px;border:0;border-radius:50%;background:#c83d3d;color:#fff;font-family:Arial,sans-serif;font-size:18px;font-weight:800;line-height:1;text-align:center;vertical-align:middle;opacity:0;visibility:hidden;pointer-events:none;cursor:pointer;box-shadow:0 1px 4px #0004;transition:opacity .12s ease,transform .12s ease}
.cell:hover .main-remove-hero,.cell:focus-within .main-remove-hero,.cell.selected .main-remove-hero{opacity:1;visibility:visible;pointer-events:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.history-actions{align-items:center}.history-actions .action-spacer{flex:1}
button{font:inherit}
.action-btn{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#30394a;color:var(--text);cursor:pointer}
.action-btn.primary{background:#c89b45;color:#211a0e;border-color:#e1b75e;font-weight:700}
.action-btn:disabled{opacity:.45;cursor:not-allowed}
.roster-tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.roster-tools #search{flex:0 1 220px;width:220px;max-width:42%;}
.roster-filter-buttons{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.roster-filter-btn{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#30394a;color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap}
.roster-filter-btn.active{background:#59462a;border-color:var(--accent);color:#ffe0a0}
body.light .roster-filter-btn{background:#fff;color:var(--text)}
body.light .roster-filter-btn.active{background:#f6e9ce;color:#77521b;border-color:#bd8a2e}
input,select{width:100%;min-width:0;background:#151b25;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit}
.hero-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;align-items:start;gap:5px;max-height:440px;overflow:auto;padding-right:3px}
.hero-option{border:1px solid var(--line);background:#282f3d;border-radius:7px;color:var(--text);text-align:left;padding:6px 5px;font-size:12px;line-height:1.25;cursor:pointer;min-width:0;height:auto;min-height:0;align-self:start}
.hero-option strong{display:block;overflow-wrap:anywhere}
.hero-option small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.hero-option.chosen{border-color:var(--accent);background:#4a3d29}
.empty-note{color:var(--muted);font-size:13px;line-height:1.6}
.selected-slot{font-size:13px;color:var(--muted);margin:-5px 0 12px}
.footer-note{color:var(--muted);font-size:12px;line-height:1.7;margin-top:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.formation-list{grid-template-columns:repeat(3,minmax(0,1fr))}.board-wrap{max-width:500px}.hero-list{max-height:330px}}
@media(max-width:380px){.formation-list{gap:6px}.formation-btn{font-size:13px;padding:10px 4px}.panel{padding:12px}.hero-list{grid-template-columns:repeat(3,minmax(0,1fr))}.cell{padding:3px}.cell .pos{margin-bottom:4px}}

/* 与军师页面一致的昼夜主题按钮和自动昼夜配色 */
body.light{
  --bg:#f4f6fa;--panel:#ffffff;--panel2:#eef1f6;--text:#242936;--muted:#687386;
  --accent:#bd8a2e;--line:#d5dae3;--active:#bfc1c4;--activeText:#17191d;--empty:#edf0f4;--danger:#c64e4a;
  background:linear-gradient(145deg,#f4f6fa,#e9edf4 60%,#f8f9fb);color:var(--text)
}
body.light .panel{background:rgba(255,255,255,.95);box-shadow:0 12px 32px #26334a12}
body.light .formation-btn{background:var(--panel2);color:var(--text)}
body.light .formation-btn.selected{background:#f6e9ce;color:#77521b;border-color:#bd8a2e}
body.light input,body.light select{background:#fff;color:var(--text)}
body.light .hero-option{background:#f6f7fa;color:var(--text)}
body.light .hero-option.chosen{background:#f6e9ce}
body.light .action-btn{background:#eef1f6;color:var(--text)}
body.light .action-btn.primary{background:#c89b45;color:#211a0e}
.page-footer{position:relative;min-height:82px;padding:12px 18px 18px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.page-footer .author{letter-spacing:.2px}
.page-footer 
.page-author-credit{width:100%;box-sizing:border-box;text-align:center;margin:14px 0 4px;color:var(--muted,#aeb7c6);font-size:13px;line-height:1.5}
.home-link{
 position:fixed;right:18px;bottom:18px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;gap:7px;
 padding:9px 15px;border:1px solid #8a754e;border-radius:999px;background:var(--panel);color:#e5ad38;
 text-decoration:none;font-weight:700;white-space:nowrap;cursor:pointer;font-size:13px;
 transition:background .15s,border-color .15s;box-shadow:0 4px 14px #0002
}
.page-footer .home-link:hover{background:var(--panel2);border-color:#e5ad38}
.page-footer .home-link svg{width:15px;height:15px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page-footer .theme-toggle{right:145px}
@media(max-width:560px){
 .page-footer{min-height:100px;align-items:flex-start;padding-top:10px}
 .page-footer .home-link{right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));padding:8px 12px}
 .page-footer .theme-toggle{right:145px;bottom:max(12px,env(safe-area-inset-bottom));padding:8px 10px;gap:5px}
}


/* 副将营与聚义营 */
.camp-layout{width:100%;max-width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.camp-panel{min-width:0}
.camp-grid{display:grid;gap:7px}
.deputy-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.gathering-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.camp-slot{min-width:0;min-height:68px;padding:8px 5px;border:1px solid var(--line);border-radius:10px;background:var(--empty);color:var(--muted);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.camp-slot .slot-number{font-size:11px;opacity:.75}
.camp-slot .slot-name{font-size:14px;font-weight:700;line-height:1.35;overflow-wrap:anywhere;color:var(--text)}
.camp-slot.selected{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.camp-slot.filled{background:#f0d7a2;border-color:#a87929;color:#352714}
.camp-slot.filled .slot-name{color:#352714}
.camp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.camp-head .section-title{margin:0}
.camp-count{font-size:12px;color:var(--muted);white-space:nowrap}
body.light .camp-slot{background:#edf0f4;color:#687386}
body.light .camp-slot .slot-name{color:#242936}
body.light .camp-slot.filled{background:#f0d7a2;border-color:#a87929}
body.light .camp-slot.filled .slot-name{color:#352714}
@media(max-width:760px){.camp-layout{grid-template-columns:1fr}.deputy-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.gathering-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:380px){.camp-slot{min-height:58px;padding:6px 3px}.camp-slot .slot-name{font-size:12px}.deputy-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}


/* 严格限制页面横向尺寸，避免网格、长文本或控件撑破 1200px 容器 */
.app > *, .panel, .formation-list, .layout, .camp-layout, .camp-panel, .roster-tools, .hero-list { min-width:0; max-width:100%; }
img, input, select, button { max-width:100%; }

/* v1.0.6: 强制所有卡片在 1200px 页面容器内，禁止 grid/flex 子项撑开 */
html, body { width:100%; max-width:100%; min-width:0; }
body { overflow-x:hidden; }
.app { width:100%; max-width:1200px; min-width:0; margin-left:auto; margin-right:auto; overflow-x:clip; }
.app > *, .panel, .layout, .camp-layout, .camp-panel, .board-wrap, .board, .formation-list,
.roster-tools, .hero-list, .camp-grid, .actions, header, header > div {
  box-sizing:border-box; min-width:0; max-width:100%;
}
.layout { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); }
.camp-layout { grid-template-columns:minmax(0, 1fr) !important; width:100%; }
.panel { width:100%; }
.board-wrap { width:100%; }
.board { width:100%; }
input, select, button { box-sizing:border-box; min-width:0; }
@media (max-width:760px) {
  .layout { grid-template-columns:minmax(0, 1fr); }
}


/* v1.0.7: 副将营/聚义营必须与主内容共用 1200px 页面边界 */
.camp-layout {
  display:grid;
  grid-template-columns:minmax(0, 1fr) !important;
  width:calc(100% - 2 * clamp(14px, 3vw, 28px)) !important;
  max-width:1200px !important;
  min-width:0 !important;
  margin-left:auto !important;
  margin-right:auto !important;
  box-sizing:border-box !important;
}
.camp-layout > .panel,
.camp-layout .camp-panel {
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  box-sizing:border-box !important;
}


/* 聚义状态：黄色为已激活，灰色为未激活 */
.union-list{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;width:100%;margin-top:5px;min-width:0}
.union-chip{display:inline-block;max-width:100%;padding:2px 5px;border-radius:5px;font-size:10px;line-height:1.35;overflow-wrap:anywhere;box-sizing:border-box;background:#d6d9df;color:#4b5563;border:1px solid #b7bec9}
.union-chip.active{background:#ffe08a;color:#6c4800;border-color:#d6a027;font-weight:700}
.union-chip.inactive{background:#d6d9df;color:#515967;border-color:#b8bec8}
.union-camp-details{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.union-camp-details .union-chip{display:block;width:100%;text-align:left;white-space:normal;line-height:1.4}
.union-main-name{font-weight:800;text-decoration:underline;text-underline-offset:2px;color:#9b2d18}
.union-chip.active .union-main-name{color:#704000}
body:not(.light) .union-main-name{color:#ffb36b}
body:not(.light) .union-chip.active .union-main-name{color:#704000}
.cell .union-list{justify-content:flex-start;align-content:flex-start}
.cell{height:auto;min-height:160px;justify-content:flex-start;overflow:hidden}
.cell .pos{margin-top:3px;margin-bottom:5px;flex:none}
.cell .hero{flex:none}
.cell .hint{flex:none;margin-top:5px}
.board{aspect-ratio:auto;grid-auto-rows:minmax(160px,auto)}
.camp-slot{height:auto;min-height:100px;justify-content:flex-start}
.camp-slot .slot-number,.camp-slot .slot-name{flex:none}
.camp-slot .union-list{justify-content:flex-start}
body.light .union-chip.inactive{background:#dfe3e9;color:#596273;border-color:#c6ccd5}
body.light .union-chip.active{background:#ffe08a;color:#6c4800;border-color:#d6a027}
@media(max-width:760px){
 .cell{min-height:145px;padding:5px 3px}
 .board{grid-auto-rows:minmax(145px,auto)}
 .camp-slot{min-height:90px}
 .union-chip{font-size:9px;padding:2px 4px}
}


/* v1.0.9：选择武将卡片固定悬浮，滚动整页时始终可用 */
.layout { grid-template-columns:minmax(0,1fr) !important; }
.layout > section:nth-child(2) {
  position:fixed !important;
  z-index:1000;
  top:112px;
  right:max(16px, calc((100vw - 1200px)/2 + 16px));
  width:min(390px, calc(100vw - 32px));
  max-width:calc(100vw - 32px);
  max-height:calc(100vh - 32px);
  max-height:calc(100dvh - 32px);
  min-width:0;
  margin:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:rgba(32,38,51,.98);
  box-shadow:0 14px 40px #0005;
  backdrop-filter:blur(10px);
}
.layout > section:nth-child(2) .hero-list {
  flex:1 1 auto;
  min-height:80px;
  max-height:none;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:max-content;
  align-content:start;
  align-items:start;
  overflow-y:auto;
  overscroll-behavior:contain;
}
.layout > section:nth-child(2) .footer-note { flex:0 0 auto; }
.layout > section:nth-child(2) .actions { flex:0 0 auto; }
body.light .layout > section:nth-child(2) {
  background:rgba(255,255,255,.98);
  box-shadow:0 14px 40px #26334a2b;
}
@media(max-width:760px) {
  .layout > section:nth-child(2) {
    top:auto;
    right:12px;
    bottom:calc(72px + env(safe-area-inset-bottom));
    left:12px;
    width:auto;
    max-width:none;
    max-height:44vh;
    max-height:44dvh;
    padding:12px;
  }
  .layout > section:nth-child(2) .section-title { margin-bottom:8px; }
  .layout > section:nth-child(2) .selected-slot { margin-bottom:8px; }
  .roster-tools #search{flex:1 1 150px;width:auto;max-width:none;}
  .layout > section:nth-child(2) .footer-note { display:none; }
  .layout > section:nth-child(2) .hero-list { min-height:70px; }
}


/* v1.1.0：左侧所有规划 UI 占 70%，右侧悬浮选将面板占 30% */
@media (min-width: 761px) {
  body { padding-right:0; }
  .app {
    width:70% !important;
    max-width:840px !important; /* 页面总宽度上限1200px的70% */
    margin-left:max(0px, calc((100vw - 1200px)/2)) !important;
    margin-right:auto !important;
    padding-right:16px;
  }
  .app header { max-width:100%; }
  .app .formation-list { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .app .layout { display:grid; grid-template-columns:minmax(0,1fr) !important; width:100%; }
  .app .layout > section:first-child { width:100%; max-width:100%; }
  .layout > section:nth-child(2) {
    position:fixed !important;
    top:112px;
    right:max(0px, calc((100vw - 1200px)/2));
    width:calc(min(1200px, 100vw) * .30) !important;
    max-width:360px !important;
    height:calc(100vh - 32px);
    height:calc(100dvh - 32px);
    max-height:none;
    box-sizing:border-box;
  }
}
@media (max-width:760px) {
  /* 小屏幕改为上下流式布局，避免左侧70%过窄 */
  .app { width:100% !important; max-width:1200px !important; margin:0 auto !important; padding:14px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) !important; }
  .layout > section:nth-child(2) {
    position:fixed !important;
    top:auto;
    right:12px;
    bottom:calc(72px + env(safe-area-inset-bottom));
    left:12px;
    width:auto !important;
    max-width:none !important;
    max-height:44vh;
    max-height:44dvh;
    height:auto;
  }
}


/* v1.1.1 修正：主阵、副将营、聚义营全部进入左侧70%列；选将卡片固定在右侧30% */
@media (min-width: 761px) {
  .app {
    width:70% !important;
    max-width:840px !important;
    margin-left:max(0px, calc((100vw - 1200px)/2)) !important;
    margin-right:auto !important;
    padding-left:clamp(14px, 3vw, 28px) !important;
    padding-right:16px !important;
    box-sizing:border-box !important;
  }
  .app > .panel,
  .app > .layout,
  .app > section,
  .app .panel {
    min-width:0 !important;
    max-width:100% !important;
    box-sizing:border-box !important;
  }
  .app .layout {
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    width:100% !important;
    max-width:100% !important;
  }
  .app .layout > section:first-child {
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
  }
  /* camp-layout 位于 .app 外部，必须单独约束到左侧70% */
  .camp-layout {
    width:70% !important;
    max-width:840px !important;
    min-width:0 !important;
    margin-left:max(0px, calc((100vw - 1200px)/2)) !important;
    margin-right:auto !important;
    padding-left:clamp(14px, 3vw, 28px) !important;
    padding-right:16px !important;
    box-sizing:border-box !important;
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
  }
  .camp-layout > .panel,
  .camp-layout .camp-panel {
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    box-sizing:border-box !important;
  }
  .layout > section:nth-child(2) {
    position:fixed !important;
    z-index:1000 !important;
    top:16px !important;
    right:max(0px, calc((100vw - 1200px)/2)) !important;
    width:calc(min(1200px, 100vw) * .30) !important;
    max-width:360px !important;
    min-width:0 !important;
    height:calc(100vh - 32px) !important;
    height:calc(100dvh - 32px) !important;
    max-height:none !important;
    overflow:hidden !important;
    box-sizing:border-box !important;
  }
}
@media (max-width:760px) {
  .app {
    width:100% !important;
    max-width:1200px !important;
    margin:0 auto !important;
    padding:14px !important;
  }
  .camp-layout {
    width:100% !important;
    max-width:1200px !important;
    margin:0 auto !important;
    padding:0 14px !important;
  }
}

state.lineups["长蛇阵"] = {};
const $ = id => document.getElementById(id);
function baseHeroName(name){if(!name)return "";let value=String(name).trim().replace(/[・･]/g,"·");const prefix=/^(?:涅槃三阶神|涅槃三阶|真|神|修罗)·/;while(prefix.test(value))value=value.replace(prefix,"");return value.trim();}
function isGodHero(name){return typeof name==="string"&&name.startsWith("神·");}
function isNirvanaHero(name){return typeof name==="string"&&name.startsWith("涅槃三阶神·");}
function isCountedGodHero(name){return isGodHero(name)||isNirvanaHero(name);}
function countGodHeroes(lineup, excludeSlot=null){return Object.entries(lineup||{}).filter(([slot,name])=>slot!==String(excludeSlot)&&isCountedGodHero(name)).length;}
function countNirvanaHeroes(lineup, excludeSlot=null){return Object.entries(lineup||{}).filter(([slot,name])=>slot!==String(excludeSlot)&&isNirvanaHero(name)).length;}
function hasNirvanaHero(lineup, excludeSlot=null){return Object.entries(lineup||{}).some(([slot,name])=>slot!==String(excludeSlot)&&isNirvanaHero(name));}
function hasOrdinaryGodHero(lineup, excludeSlot=null){return Object.entries(lineup||{}).some(([slot,name])=>slot!==String(excludeSlot)&&isGodHero(name));}
function hasOppositeGodTier(lineup, heroName, excludeSlot=null){
  const base=baseHeroName(heroName);
  if(!base||!isCountedGodHero(heroName))return false;
  return Object.entries(lineup||{}).some(([slot,name])=>slot!==String(excludeSlot)&&name&&baseHeroName(name)===base&&((isNirvanaHero(heroName)&&isGodHero(name))||(isGodHero(heroName)&&isNirvanaHero(name))));
}
function violatesGodTierExclusivity(lineup){
  const entries=Object.entries(lineup||{}).filter(([,name])=>name);
  return entries.some(([slot,name])=>isCountedGodHero(name)&&hasOppositeGodTier(lineup,name,slot));
}
function displayHeroName(name){if(!name)return "";const shown=(isGodHero(name)||String(name).startsWith("修罗·")||String(name).startsWith("涅槃三阶神·"))?String(name):`真·${baseHeroName(name)}`;return shown.replace(/·/g,"・");}
const currentFormation = () => formations.find(f=>f.name===state.formation);
// 三个阵营分别维护独立的撤销/重做历史；每个按钮只恢复自身阵营。
const historyByArea={
  main:{undo:[],redo:[]},
  deputy:{undo:[],redo:[]},
  gathering:{undo:[],redo:[]}
};
function snapshotArea(area){
  if(area==="main")return {formation:state.formation,lineup:JSON.parse(JSON.stringify(state.lineups[state.formation]||{}))};
  return JSON.parse(JSON.stringify(area==="deputy"?state.deputy:state.gathering));
}
function recordUndo(area){
  if(!historyByArea[area])return;
  const history=historyByArea[area];
  history.undo.push(snapshotArea(area));
  if(history.undo.length>10)history.undo.shift();
  history.redo.length=0;
  updateHistoryButtons();
}
function restoreArea(area,snap){
  if(area==="main"){
    state.formation=snap.formation;
    state.lineups[state.formation]=JSON.parse(JSON.stringify(snap.lineup));
    state.selectedPosition=null;
    state.selectedCamp=null;
  }else if(area==="deputy"){
    state.deputy=JSON.parse(JSON.stringify(snap));
    if(state.selectedCamp?.area===area)state.selectedCamp=null;
  }else{
    state.gathering=JSON.parse(JSON.stringify(snap));
    if(state.selectedCamp?.area===area)state.selectedCamp=null;
  }
  $("slotPrompt").textContent="请先点击主阵、副将营或聚义营中的一个位置。";
  renderFormations();renderBoard();renderCamps();renderHeroes();
  updateHistoryButtons();
}
function undoAction(area){
  const history=historyByArea[area];if(!history||!history.undo.length)return;
  history.redo.push(snapshotArea(area));
  restoreArea(area,history.undo.pop());
}
function redoAction(area){
  const history=historyByArea[area];if(!history||!history.redo.length)return;
  history.undo.push(snapshotArea(area));
  if(history.undo.length>10)history.undo.shift();
  restoreArea(area,history.redo.pop());
}
function updateHistoryButtons(){
  [["main","undoMain","redoMain"],["deputy","undoDeputy","redoDeputy"],["gathering","undoGathering","redoGathering"]].forEach(([area,undoId,redoId])=>{
    const h=historyByArea[area],u=$(undoId),r=$(redoId);
    if(u)u.disabled=!h.undo.length;
    if(r)r.disabled=!h.redo.length;
  });
}

$("redoMain").addEventListener("click",()=>redoAction("main"));

function allLineupNames(){
  const names = new Set();
  Object.values(state.lineups[state.formation] || {}).forEach(n=>{if(n)names.add(baseHeroName(n))});
  Object.values(state.deputy || {}).forEach(n=>{if(n)names.add(baseHeroName(n))});
  Object.values(state.gathering || {}).forEach(n=>{if(n)names.add(baseHeroName(n))});
  return names;
}
function heroUnions(heroName){const base=baseHeroName(heroName);return unionData.filter(u=>baseHeroName(u.hero)===base);}
function mainLineupNames(){
  return new Set(Object.values(state.lineups[state.formation] || {}).filter(Boolean).map(baseHeroName));
}
function unionMarkup(heroName, showDetails=false, campPerspective=false){
  if(!heroName)return "";
  const lookupName=baseHeroName(heroName);
  const present=allLineupNames();
  let entries;
  if(campPerspective){
    // 副将营/聚义营只展示“主阵武将发起、且当前已点亮”的聚义。
    // 不展示营位武将自身的全部聚义，也不展示未点亮或与当前营位无关的聚义。
    const mainNamesForCamp=mainLineupNames();
    entries=unionData.filter(u=>{
      // 按武将本名判断；营位武将必须是主阵发起的聚义目标，且该条聚义的所有目标均已上阵。
      const initiator=baseHeroName(u.hero);
      const targets=Array.isArray(u.targets)?u.targets.map(baseHeroName):[];
      return mainNamesForCamp.has(initiator) &&
        targets.includes(lookupName) &&
        targets.length>0 &&
        targets.every(target=>present.has(target)) &&
        present.has(initiator);
    });
    const seen=new Set();
    entries=entries.filter(u=>{
      const key=JSON.stringify([baseHeroName(u.hero),u.name,u.effect,u.targets.map(baseHeroName)]);
      if(seen.has(key))return false;
      seen.add(key);return true;
    });
  }else{
    entries=heroUnions(lookupName);
  }
  if(!entries.length)return "";
  const mainNames=mainLineupNames();
  return `<div class="union-list${showDetails?" union-details":""}${campPerspective?" union-camp-details":""}" aria-label="${escapeHtml(displayHeroName(heroName))}聚义列表">`+
    entries.map(u=>{
      const active=present.has(baseHeroName(u.hero)) && u.targets.length>0 && u.targets.every(n=>present.has(baseHeroName(n)));
      const targetText=u.targets.map(baseHeroName).join("、");
      const detail=`与${targetText||"指定武将"}上阵，${u.effect}`;
      const title=`${u.name}：${baseHeroName(u.hero)}${detail}${active?"；已激活":"；未激活"}`;
      let label;
      if(campPerspective){
        const highlightName=n=>mainNames.has(n)?`<span class="union-main-name">${escapeHtml(baseHeroName(n))}</span>`:escapeHtml(baseHeroName(n));
        const highlightedTargets=u.targets.map(highlightName).join("、");
        label=`${escapeHtml(u.name)}：${highlightName(u.hero)}与${highlightedTargets||"指定武将"}上阵，${escapeHtml(u.effect)}`;
      }else{
        if(showDetails){
          // 主阵聚义描述始终显示完整目标条件，避免目标已在主阵时隐藏目标名称造成描述不完整。
          const visibleDetail=`：与${u.targets.map(n=>baseHeroName(n)).join("、")}上阵，${u.effect}`;
          label=escapeHtml(`${u.name}${visibleDetail}`);
        }else{
          label=escapeHtml(u.name);
        }
      }
      return `<span class="union-chip ${active?"active":"inactive"}" title="${escapeHtml(title)}">${label}</span>`;
    }).join("")+ 
    `</div>`;
}

function lineupForArea(area, formationName=state.formation){
  if(area==="main") return state.lineups[formationName];
  if(area==="deputy") return state.deputy;
  if(area==="gathering") return state.gathering;
  return null;
}
function getActiveUnionKeys(){
  // 聚义统计只从主阵武将视角计算；目标武将可在主阵、副将营或聚义营。
  // 返回具体聚义集合，而不是只返回总数，避免“点亮一个、熄灭一个”数量相抵后漏报。
  const present=allLineupNames();
  const mainNames=mainLineupNames();
  return new Set(unionData
    .filter(u=>mainNames.has(u.hero)&&u.targets.length>0&&u.targets.every(n=>present.has(n)))
    .map(u=>JSON.stringify([u.hero,u.name,u.targets,u.effect])));
}
function showLineupChange(beforeUnions, afterUnions){
  const lit=[...afterUnions].filter(key=>!beforeUnions.has(key)).length;
  const extinguished=[...beforeUnions].filter(key=>!afterUnions.has(key)).length;
  if(!lit&&!extinguished)return;
  let toast=document.getElementById("lineupChangeToast");
  if(!toast){toast=document.createElement("div");toast.id="lineupChangeToast";toast.className="lineup-toast";toast.setAttribute("role","status");toast.setAttribute("aria-live","polite");document.body.appendChild(toast);}
  const parts=[];
  if(lit)parts.push(`<span class="lit">点亮了${lit}个聚义</span>`);
  if(extinguished)parts.push(`<span class="extinguished">熄灭了${extinguished}个聚义</span>`);
  toast.innerHTML=`阵容变更　${parts.join("，")}`;
  clearTimeout(window.__qqshToastTimer);
  window.__qqshToastTimer=setTimeout(()=>toast.remove(),4200);
}
function showRedToast(message){
  let toast=document.getElementById("lineupChangeToast");
  if(!toast){toast=document.createElement("div");toast.id="lineupChangeToast";toast.className="lineup-toast";toast.setAttribute("role","status");toast.setAttribute("aria-live","polite");document.body.appendChild(toast);}
  toast.innerHTML=`<span class="extinguished">${escapeHtml(message)}</span>`;
  clearTimeout(window.__qqshToastTimer);
  window.__qqshToastTimer=setTimeout(()=>toast.remove(),3000);
}
function removeSlotHero(area, slot, formation=state.formation){
  const lineup=lineupForArea(area,formation);
  if(!lineup||!lineup[slot])return false;
  const before=getActiveUnionKeys();
  recordUndo(area);
  delete lineup[slot];
  if(area==="main" && state.selectedPosition===Number(slot))state.selectedPosition=null;
  if(area!=="main" && state.selectedCamp&&state.selectedCamp.area===area&&Number(state.selectedCamp.slot)===Number(slot))state.selectedCamp=null;
  const after=getActiveUnionKeys();
  showLineupChange(before,after);
  $("slotPrompt").textContent="请先点击主阵、副将营或聚义营中的一个位置。";
  renderBoard();renderCamps();renderHeroes();
  return true;
}
function swapSlotContents(source, targetArea, targetSlot){
  const sourceLineup=lineupForArea(source.area, source.formation || state.formation);
  const targetLineup=lineupForArea(targetArea, state.formation);
  if(!sourceLineup || !targetLineup) return;
  if(source.area==="main" && source.formation!==state.formation) return;
  if(source.area==="main" && !activePosition(source.slot)) return;
  if(targetArea==="main" && !activePosition(targetSlot)) return;
  if(source.area===targetArea && Number(source.slot)===Number(targetSlot)) return;
  const beforeUnionCount=getActiveUnionKeys();
  const sourceHero=sourceLineup[source.slot];
  if(!sourceHero) return;
  const targetHero=targetLineup[targetSlot];
  if((targetArea==="deputy"||targetArea==="gathering")&&isCountedGodHero(sourceHero)){
    showRedToast("神将不得上阵副将营或聚义营");return;
  }
  if((source.area==="deputy"||source.area==="gathering")&&targetArea==="main"&&targetHero&&isCountedGodHero(targetHero)&&!isCountedGodHero(sourceHero)){
    // Swapping a non-god into the camp slot is allowed; the god is being moved out to main.
  }
  if(targetArea==="main"){
    const projected={...(state.lineups[state.formation]||{})};
    if(source.area==="main")delete projected[source.slot];
    if(targetHero && source.area==="main")projected[source.slot]=targetHero; else if(source.area==="main")delete projected[source.slot];
    projected[targetSlot]=sourceHero;
    if(violatesGodTierExclusivity(projected)){showRedToast("涅槃神将与未涅槃神将不能同时上阵");return;}
    if(countGodHeroes(projected)>3){alert("一个阵型内最多只能上阵三个神将（包含涅槃三阶）。");return;}
    if(countNirvanaHeroes(projected)>2){alert("一个阵型内最多只能上阵两个涅槃三阶武将。");return;}
  }
  recordUndo(source.area);
  if(targetArea!==source.area)recordUndo(targetArea);
  if(targetHero) sourceLineup[source.slot]=targetHero; else delete sourceLineup[source.slot];
  targetLineup[targetSlot]=sourceHero;
  if(targetArea==="main"){
    state.selectedPosition=targetSlot;state.selectedCamp=null;
    $("slotPrompt").textContent=`当前选择：主阵 ${state.formation} · 位置 ${targetSlot} · ${sourceHero}`;
  }else{
    state.selectedPosition=null;state.selectedCamp={area:targetArea,slot:targetSlot};
    $("slotPrompt").textContent=`当前选择：${targetArea==="deputy"?"副将营":"聚义营"} · 位置 ${targetSlot} · ${sourceHero}`;
  }
  renderBoard();renderCamps();renderHeroes();
  showLineupChange(beforeUnionCount,getActiveUnionKeys());
}
function enableSlotDrag(sourceButton, area, slot){
  const lineup=lineupForArea(area);
  sourceButton.draggable=!!lineup?.[slot];
  if(!sourceButton.draggable) return;
  sourceButton.classList.add("slot-draggable");
  sourceButton.addEventListener("dragstart",ev=>{
    window.__qqshActiveSlotDrag={area,slot:Number(slot),formation:state.formation};window.__qqshSlotDropHandled=false;
    ev.dataTransfer.setData("application/x-qqsh-slot",JSON.stringify({area,slot:Number(slot),formation:state.formation}));
    ev.dataTransfer.effectAllowed="move";
    document.querySelectorAll(".cell.active,.camp-slot").forEach(el=>el.classList.add("drop-ready"));
  });
  sourceButton.addEventListener("dragend",()=>{
    window.__qqshActiveSlotDrag=null;
    document.querySelectorAll(".drop-ready,.drop-hover").forEach(el=>el.classList.remove("drop-ready","drop-hover"));
  });
}
function assignDraggedHero(heroName, area, slot){
  if(!heroName || !heroes.some(h=>h.name===heroName))return;
  if((area==="deputy"||area==="gathering")&&isCountedGodHero(heroName)){
    showRedToast("神将不得上阵副将营或聚义营");return;
  }
  let lineup;
  if(area==="main"){
    if(!activePosition(slot))return;
    lineup=state.lineups[state.formation];
    state.selectedPosition=slot;
    state.selectedCamp=null;
    $("slotPrompt").textContent=`当前选择：主阵 ${state.formation} · 位置 ${slot} · ${heroName}`;
  }else if(area==="deputy" || area==="gathering"){
    lineup=area==="deputy"?state.deputy:state.gathering;
    state.selectedPosition=null;
    state.selectedCamp={area,slot};
    $("slotPrompt").textContent=`当前选择：${area==="deputy"?"副将营":"聚义营"} · 位置 ${slot} · ${heroName}`;
  }else{return;}
  if(area==="main" && hasOppositeGodTier(lineup,heroName,slot)){
    showRedToast("涅槃神将与未涅槃神将不能同时上阵");return;
  }
  if(area==="main" && isCountedGodHero(heroName) && lineup[slot]!==heroName && countGodHeroes(lineup,slot)>=3){
    alert("一个阵型内最多只能上阵三个神将（包含涅槃三阶）。");return;
  }
  if(area==="main" && isNirvanaHero(heroName) && lineup[slot]!==heroName && countNirvanaHeroes(lineup,slot)>=2){
    alert("一个阵型内最多只能上阵两个涅槃三阶武将。");return;
  }
  // Match existing selection behavior: no duplicate hero within the same lineup/camp.
  const beforeUnionCount=getActiveUnionKeys();
  if(lineup[slot]!==heroName || Object.keys(lineup).some(pos=>pos!==String(slot)&&lineup[pos]===heroName))recordUndo(area);
  Object.keys(lineup).forEach(pos=>{if(lineup[pos]===heroName)delete lineup[pos];});
  lineup[slot]=heroName;
  
  renderBoard();renderCamps();renderHeroes();
  showLineupChange(beforeUnionCount,getActiveUnionKeys());
}
function enableHeroDrop(target, area, slot){
  target.addEventListener("dragover",ev=>{
    ev.preventDefault();
    target.classList.add("drop-hover");
  });
  target.addEventListener("dragleave",()=>{
    target.classList.remove("drop-hover");
  });
  target.addEventListener("drop",ev=>{
    ev.preventDefault();
    target.classList.remove("drop-hover");
    target.classList.remove("drop-ready");
    const candidateName=ev.dataTransfer?.getData("application/x-qqsh-union-candidate");
    if(candidateName){
      // 聚义候补可拖入主阵、副将营或聚义营。
      assignDraggedHero(candidateName,area,slot);
      return;
    }
    const slotPayload=ev.dataTransfer?.getData("application/x-qqsh-slot");
    if(slotPayload){
      window.__qqshSlotDropHandled=true;
      try{swapSlotContents(JSON.parse(slotPayload),area,slot);}catch(_e){}
      return;
    }
    const heroName=ev.dataTransfer?.getData("text/plain");
    if(heroName)assignDraggedHero(heroName,area,slot);
  });
}

/* v1.2.96：主阵聚义描述保留完整目标；智能补齐优先补完已部分满足的聚义。 */
function smartFillCamps(targetArea=null){
  const main=state.lineups[state.formation]||{};
  const mainNames=new Set(Object.values(main).filter(Boolean).map(baseHeroName));
  if(!mainNames.size){showRedToast("请先在主阵上阵武将，再使用智能补齐");return;}

  const deputyBefore=JSON.stringify(state.deputy), gatheringBefore=JSON.stringify(state.gathering);
  // 阵型对应的智能补齐优先属性。
  const priorityStatByFormation={
    "长蛇阵":"速度",
    "飞龙阵":"武力攻击",
    "风扬阵":"法术攻击",
    "云垂阵":"法术防御",
    "天覆阵":"生命",
    "地载阵":"武力防御"
  };

  const deputySnapshot=snapshotArea("deputy"), gatheringSnapshot=snapshotArea("gathering");
  const occupiedBase=()=>new Set([
    ...Object.values(main),...Object.values(state.deputy),...Object.values(state.gathering)
  ].filter(Boolean).map(baseHeroName));

  const unionGoals=()=>unionData.filter(u=>mainNames.has(baseHeroName(u.hero))&&Array.isArray(u.targets)&&u.targets.length>0);
  const variantsByBase=new Map();
  heroes.forEach(h=>{
    const base=baseHeroName(h.name);
    if(!base)return;
    if(!variantsByBase.has(base))variantsByBase.set(base,[]);
    variantsByBase.get(base).push(h);
  });
  const availableVariant=(base, preferShura)=>{
    const variants=variantsByBase.get(base)||[];
    // 副将营：只要该本名有可用修罗形态，就优先使用修罗；否则回退到原始真将。
    if(preferShura){const shura=variants.find(h=>h.type==="修罗");if(shura)return shura.name;}
    const trueHero=variants.find(h=>h.name===base&&(h.type==="天罡"||h.type==="地煞"));
    if(trueHero)return trueHero.name;
    const other=variants.find(h=>h.name===base);
    return other?other.name:null;
  };

    const lineup=area==="deputy"?state.deputy:state.gathering;
    const emptySlots=Array.from({length:capacity},(_,i)=>String(i+1)).filter(slot=>!lineup[slot]);

      const present=occupiedBase();
      const scoreByBase=new Map();
      unionGoals().forEach(u=>{
        const missing=[...new Set(u.targets.map(baseHeroName).filter(Boolean))].filter(n=>!present.has(n));
        if(!missing.length)return;
        // 优先补缺口较少的聚义；副将营的修罗候选另加优先权。
        // 先补齐已经部分满足的聚义，避免选中一个目标后却长期漏掉其搭档；阵型属性仍作为优先项。
        const alreadyPresent=u.targets.length-missing.length;
        const completionBonus=alreadyPresent>0?1200:0;
        const effectText=String(u.effect||"");
        const statBonus=preferredStat&&effectText.includes(preferredStat)?500:0;
        // 长蛇阵明确将两类防御聚义置于最低优先级，避免其抢占速度聚义。
        const longSnakeDefensePenalty=state.formation==="长蛇阵"&&/武力防御|法术防御/.test(effectText)?-2000:0;
        const score=100/missing.length+completionBonus+statBonus+longSnakeDefensePenalty;
        missing.forEach(base=>{
          const variant=availableVariant(base,preferShura);
          if(!variant||isCountedGodHero(variant))return;
          const isShura=heroes.some(h=>h.name===variant&&h.type==="修罗");

        });
      });
      const choices=[...scoreByBase.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"zh-CN"));

        });
        if(!next)break;
        const slot=emptySlots.shift();
        lineup[slot]=availableVariant(next[0],preferShura);

      }
      const slot=emptySlots.shift();
      lineup[slot]=variant;
    }
  };
  // 第一阶段：副将营优先放可凑成主阵聚义的修罗；该本名没有修罗形态时才放真将。

  // 聚义营补齐时，排除主阵和副将营已使用的武将本名。
  if(targetArea===null||targetArea==="gathering")fillArea("gathering",9,false);

  renderBoard();renderCamps();renderHeroes();
  showLineupChange(before,getActiveUnionKeys());
}

   const canvas=document.createElement('canvas');canvas.width=W*exportScale;canvas.height=H*exportScale;const ctx=canvas.getContext('2d');
   if(!ctx)throw new Error('当前预览环境不支持 Canvas 2D');
   ctx.scale(exportScale,exportScale);
   const light=shareImageLightTheme(), bg=light?'#f1f3f7':'#1b2230', panel=light?'#ffffff':'#252c3a', card=light?'#f6e9ce':'#393226', fg=light?'#242936':'#f4f5f7', gold='#d6a84f', muted=light?'#687386':'#aeb7c6';
   ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=panel;roundRect(ctx,24,24,W-48,H-48,28);ctx.fill();ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.stroke();watermark(ctx,light,H,deputyGridY,deputyGridH);
   ctx.fillStyle=fg;ctx.font='bold 45px system-ui,"Microsoft YaHei",sans-serif';ctx.fillText('阵容分享方案',58,100);
   const description=(document.getElementById('formationDescription')?.value||'').trim();
   const descX=420,descY=54,descW=520,descH=100;
   ctx.fillStyle=light?'#f7f8fb':'#202633';roundRect(ctx,descX,descY,descW,descH,12);ctx.fill();
   ctx.strokeStyle=light?'#cbd1dc':'#394253';ctx.lineWidth=1.5;roundRect(ctx,descX,descY,descW,descH,12);ctx.stroke();
   if(description){
     ctx.save();ctx.beginPath();ctx.rect(descX+14,descY+10,descW-28,descH-20);ctx.clip();
     ctx.fillStyle=fg;ctx.font='bold 25px system-ui,"Microsoft YaHei",sans-serif';ctx.textAlign='left';
     const maxLineWidth=descW-28,lineHeight=32;let line='',lines=[];
     for(const ch of description){if(ctx.measureText(line+ch).width>maxLineWidth&&line){lines.push(line);line=ch;}else line+=ch;}
     if(line)lines.push(line);
     const visibleLines=lines.slice(0,2),totalHeight=visibleLines.length*lineHeight,startY=descY+(descH-totalHeight)/2+24;
     visibleLines.forEach((item,index)=>ctx.fillText(item,descX+14,startY+index*lineHeight));
     ctx.restore();
   }else{
     ctx.fillStyle=muted;ctx.font='22px system-ui,"Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('阵型描述',descX+descW/2,descY+descH/2+7);
   }
   function sectionTitle(title,y){ctx.fillStyle=gold;ctx.font='bold 34px system-ui,"Microsoft YaHei",sans-serif';ctx.textAlign='left';ctx.fillText(title,58,y);}
   function drawGrid(names,activePositions,y,cols,rows,cellW,cellH,gapX,gapY,descriptions=null){
     const totalW=cols*cellW+(cols-1)*gapX, left=(W-totalW)/2;
     for(let i=0;i<names.length;i++){
       const x=left+(i%cols)*(cellW+gapX), yy=y+Math.floor(i/cols)*(cellH+gapY), active=!activePositions||activePositions.includes(i+1);
       ctx.fillStyle=active?card:(light?'#e6e9ef':'#202633');roundRect(ctx,x,yy,cellW,cellH,12);ctx.fill();ctx.strokeStyle=active?gold:(light?'#cbd1dc':'#394253');ctx.lineWidth=1.5;ctx.stroke();
       if(active){
         const lines=descriptions&&descriptions[i]?descriptions[i]:[];
         ctx.fillStyle=fg;
         if(lines.length){
           fitText(ctx,names[i]||'空位',x+cellW/2,yy+30,cellW-18,22);
           // 聚义描述不换行、不截断；白天主题使用深棕金色，夜间主题使用浅金色。
           ctx.save();
           ctx.fillStyle=light?'#593800':'#ffdf86';
           ctx.font='bold 18px SimSun,"宋体",serif';
           ctx.textAlign='left';
           lines.forEach((text,j)=>ctx.fillText(text,x+44,yy+61+j*21));
           ctx.restore();
           continue;
         }else{
           fitText(ctx,names[i]||'空位',x+cellW/2,yy+cellH/2+8,cellW-18,25);
         }
       } 
     }
   }
   sectionTitle(f.name,mainTitleY);
   drawGrid(mainNames,f.positions,mainGridY,3,3,270,mainCellH,18,14);
   sectionTitle('副将营',deputyTitleY);
   drawGrid(deputyNames,null,deputyGridY,4,2,205,campCellH,14,14,deputyDescriptions);
   sectionTitle('聚义营',gatheringTitleY);
   drawGrid(gatheringNames,null,gatheringGridY,3,3,270,campCellH,18,14,gatheringDescriptions);
   // 不依赖 canvas.toBlob 回调，兼容部分在线预览容器；预览与分享共用同一张 PNG。
   const url=canvas.toDataURL('image/png');
   const base64=url.slice(url.indexOf(',')+1);
   const binary=atob(base64);
   const bytes=new Uint8Array(binary.length);
   for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
   const blob=new Blob([bytes],{type:'image/png'});
   return Promise.resolve({blob,url,filename:'QQ水浒-阵容分享方案.png'});
 }
 function normName(name){return name?displayHeroName(name):'空位';}
 function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
 // 实时同步预览：监听主阵、副将营、聚义营及阵型标题的 DOM 更新。
 let previewTimer=0, previewBusy=false, previewAgain=false;
 async function refreshSharePreview(){
   if(previewBusy){previewAgain=true;return;}
   previewBusy=true;
   try{
     const im=await renderCombined();
     const img=document.getElementById('shareCombinedPreview');
     const caption=document.getElementById('shareCombinedCaption');
     if(img){img.src=im.url;img.alt='当前阵容方案实时预览';img.style.display='block';}
     if(caption)caption.textContent='阵容已实时更新 · '+currentFormation().name;
   }catch(err){
     console.error('实时更新分享预览失败：',err);
     const caption=document.getElementById('shareCombinedCaption');
     if(caption)caption.textContent='预览生成失败，请点击「分享方案」重试';
   }
   finally{
     previewBusy=false;
     if(previewAgain){previewAgain=false;refreshSharePreview();}
   }
 }
 function queueSharePreview(){if(previewTimer)clearTimeout(previewTimer);previewTimer=setTimeout(()=>{Promise.resolve().then(refreshSharePreview).catch(err=>console.error('预览刷新异常：',err));},120);}
 document.addEventListener('share-theme-changed',queueSharePreview);
 const descriptionInput=document.getElementById('formationDescription');
 if(descriptionInput)descriptionInput.addEventListener('input',queueSharePreview);
 const previewTargets=['board','boardName','deputyGrid','gatheringGrid'];
 if(typeof MutationObserver==='function'){
   const observer=new MutationObserver(queueSharePreview);
   previewTargets.forEach(id=>{const el=document.getElementById(id);if(el)observer.observe(el,{subtree:true,childList:true,characterData:true,attributes:true});});
 }

 } catch(initErr) {

/* 昼夜模式与军师页面保持一致：06:00–17:59 白天，18:00–05:59 夜间；可手动切换 */
(function(){
  const body=document.body;
  const button=document.getElementById('themeToggle');
  if(!button)return;
  let manualTheme=null;
  let lastSchedulePeriod='';
  function scheduledTheme(){const h=new Date().getHours();return h>=6&&h<18?'day':'night';}
  function periodKey(){const n=new Date();return n.getFullYear()+'-'+n.getMonth()+'-'+n.getDate()+'-'+(n.getHours()>=18?'night':n.getHours()<6?'night':'day');}
  function apply(theme){
    const night=theme==='night';
    body.classList.toggle('dark',night);
    body.classList.toggle('light',!night);
    button.setAttribute('aria-pressed',String(night));
    button.setAttribute('aria-label',night?'切换到白天模式':'切换到夜间模式');
    const svg=button.querySelector('svg');
    if(svg)svg.innerHTML=night
      ?'<path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path>'
      :'<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42-1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>';
    document.dispatchEvent(new CustomEvent('share-theme-changed'));
  }
  function refreshByClock(){const p=periodKey();if(p!==lastSchedulePeriod){lastSchedulePeriod=p;manualTheme=null;}apply(manualTheme||scheduledTheme());}
  button.addEventListener('click',function(){manualTheme=(body.classList.contains('dark')?'day':'night');apply(manualTheme);});
  lastSchedulePeriod=periodKey();apply(scheduledTheme());window.setInterval(refreshByClock,30000);
})();
