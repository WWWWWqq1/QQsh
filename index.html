<title>水泊梁山</title>
<style>
:root {
  color-scheme: dark;
  --ease: cubic-bezier(.22,.75,.24,1);
  --menu-max-width: 1250px;
  --button-ratio: 810 / 215;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: #172332;
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
}
.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 360px;
  overflow: hidden;
  isolation: isolate;
  background: #172332;
}
.backdrop {
  position: absolute;
  inset: 0;
  z-index: -2;
  background-color: #172332;
  background-image: none;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  /* Background is decorative; load it after the buttons are available. */
  content-visibility: auto;
  transform: none;
  transition: none;
}
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(8,15,24,.04) 0%, transparent 45%, rgba(8,15,24,.12) 100%);
}
.menu {
  position: absolute;
  left: 50%;
  top: 52%;
  width: min(94vw, var(--menu-max-width));
  max-height: calc(100% - 96px);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: center;
  justify-items: center;
  gap: clamp(8px, 1.5vw, 22px);
  transform: translate(-50%, -50%);
  contain: layout paint;
}
.menu-link {
  display: block;
  width: 100%;
  min-width: 0;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: pointer;
  line-height: 0;
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease-out;
}
.menu-link img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: var(--button-ratio);
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}
.menu-link:hover {
  transform: translateY(-2px) scale(1.008);
}
.menu-link:active { transform: translateY(1px) scale(.985); filter: brightness(.96); }
.menu-link:focus-visible { outline: 2px solid #ffe4a0; outline-offset: 4px; border-radius: 20px; }
/* 桌面端最后一行不足三项时居中 */
.menu-link:last-child:nth-child(3n+1),
.menu-link:last-child:nth-child(3n+2) { grid-column: 2; }

.contact-author {
  position: absolute;
  right: max(20px, env(safe-area-inset-right));
  bottom: max(20px, env(safe-area-inset-bottom));
  z-index: 5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 13px 20px;
  border: 1px solid rgba(255,225,160,.72);
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(35,54,76,.92), rgba(12,24,40,.94));
  color: #ffe7ad;
  text-decoration: none;
  font: 700 15px/1.2 "Microsoft YaHei", system-ui, sans-serif;
  letter-spacing: .04em;
  box-shadow: 0 6px 22px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.14);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: transform .2s var(--ease), filter .2s var(--ease);
}
.contact-author:hover { transform: translateY(-2px); filter: brightness(1.12); }
.contact-author:active { transform: scale(.97); }
.contact-author:focus-visible { outline: 2px solid #ffe4a0; outline-offset: 4px; }
.contact-author svg { width: 19px; height: 19px; flex: none; }

@media (max-width: 700px) {
  .backdrop { background-size: auto 100%; background-position: center; transform: none; }
  .menu {
    top: 49%;
    width: min(94vw, 460px);
    max-height: calc(100% - 100px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(5px, 1.1vh, 12px) 8px;
  }
  .menu-link:last-child:nth-child(odd) { grid-column: 1 / -1; width: 50%; }
  .menu-link:hover { transform: scale(1.015); }
  .contact-author {
    right: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(50%);
    white-space: nowrap;
    padding: 10px 16px;
    font-size: 13px;
  }
  .contact-author:hover { transform: translateX(50%) translateY(-2px); }
  .contact-author:active { transform: translateX(50%) scale(.97); }
}
@media (max-width: 360px) {
  .menu { width: 96vw; column-gap: 5px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .menu {
    top: 48%;
    width: min(94vw, 1250px);
    max-height: calc(100% - 60px);
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px 10px;
  }
  .menu-link:last-child:nth-child(3n+1),
  .menu-link:last-child:nth-child(3n+2),
  .menu-link:last-child:nth-child(odd) { grid-column: auto; width: 100%; }
  .contact-author { right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); padding: 8px 12px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}
.background-ready .backdrop { background-image: url("liangshan-background.webp"); }
</style>
</head>

<script>
/* 先呈现七个功能入口，再加载装饰背景；背景失败不影响按钮使用。 */
(function () {
  var loadBackground = function () {
    var img = new Image();
    img.onload = function () {
      document.documentElement.classList.add('background-ready');
    };
    img.src = 'liangshan-background.webp';
  };
  if ('requestIdleCallback' in window) {
    requestIdleCallback(loadBackground, { timeout: 1200 });
  } else {
    window.setTimeout(loadBackground, 250);
  }
})();
</script>
