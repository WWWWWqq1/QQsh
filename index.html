<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20150f">
  <title>水泊梁山 · 江湖入口</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #17120e; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .scene {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center center;
      user-select: none; -webkit-user-drag: none;
    }
    /* 按钮外观已在背景图中；这里覆盖透明点击区域，确保外观与参考图完全一致。 */
    .hotspot {
      position: fixed; display: block; z-index: 2;
      top: 50.2%; height: 13.8%;
      border-radius: 28px; outline-offset: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot-tianji { left: 17.4%; width: 31.5%; }
    .hotspot-shenshou { left: 52.7%; width: 31.3%; }
    .hotspot:focus-visible { outline: 3px solid #fff0b5; }
    .hotspot:hover { background: rgba(255,255,255,.035); }
    @media (max-aspect-ratio: 4/3) {
      /* 窄屏下背景仍以 cover 显示，点击区域跟随画面中心的按钮区域。 */
      .scene { object-position: center center; }
      .hotspot { top: 50.2%; height: 13.8%; }
      .hotspot-tianji { left: 17.4%; width: 31.5%; }
      .hotspot-shenshou { left: 52.7%; width: 31.3%; }
    }
  </style>
</head>
<body>
  <img class="scene" src="liangshan-background.png" alt="水泊梁山山寨与水乡风景">
  <a class="hotspot hotspot-tianji" href="tianjige.html" aria-label="进入天机阁" title="天机阁"></a>
  <a class="hotspot hotspot-shenshou" href="shenshou.html" aria-label="进入神兽" title="神兽"></a>
</body>
</html>
